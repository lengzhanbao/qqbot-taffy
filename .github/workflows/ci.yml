name: CI

on: [push, pull_request]

jobs:
  test:
    # bridge_qq 依赖 ctypes.wintypes（Windows 专属），只能在 windows 跑
    runs-on: windows-latest
    env:
      QQ_TEST_MODE: "1"
      PYTHONIOENCODING: "utf-8"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests and write summary
        shell: pwsh
        run: |
          $out = python -m pytest tests/ -q --tb=short -p no:cacheprovider 2>&1 | Out-String
          # 写进 GITHUB_STEP_SUMMARY（annotations 会截断，这个不会）
          $summary = "## pytest output`n``````n$out`n``````"
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          # 也写入 GITHUB_OUTPUT 供后续步骤读取
          $failed = ($out -split "`n") | Where-Object { $_ -match "^FAILED|^ERROR" }
          $failLine = ($failed | Select-Object -First 5) -join " | "
          "fail_count=$($failed.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "failed_tests=$failLine" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # 前 60 行给 annotations
          $head = ($out -split "`n") | Select-Object -Last 30
          $joined = ($head -join " ~ ") -replace "`r`n|`n", " "
          if ($failed.Count -gt 0) {
            echo "::error::pytest failed: $failLine"
          }
          $out | Out-File -FilePath pytest_output.txt -Encoding utf8
          $exit = $LASTEXITCODE
          if ($exit -ne 0) { exit $exit }
      - name: Show failure detail
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path pytest_output.txt) {
            Write-Host "=== FAILED/ERROR lines ==="
            Select-String -Path pytest_output.txt -Pattern "^FAILED|^ERROR" | Select-Object -First 30 | ForEach-Object { Write-Host $_.Line }
            Write-Host "=== First traceback ==="
            Select-String -Path pytest_output.txt -Pattern "^\w+Error|assert|E  " | Select-Object -First 25 | ForEach-Object { Write-Host $_.Line }
          }
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest_output.txt
          retention-days: 7
