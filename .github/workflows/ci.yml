name: CI

on: [push, pull_request]

jobs:
  test:
    # bridge_qq 依赖 ctypes.wintypes（Windows 专属），只能在 windows 跑
    runs-on: windows-latest
    env:
      QQ_TEST_MODE: "1"
      PYTHONIOENCODING: "utf-8"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Python and deps info
        run: |
          python --version
          pip list --format=freeze > deps.txt
          Get-Content deps.txt | Select-Object -First 40
      - name: Run tests (detail)
        id: tests
        shell: pwsh
        run: |
          $out = python -m pytest tests/ -q --tb=short -p no:cacheprovider 2>&1
          $out | Out-File -FilePath pytest_output.txt -Encoding utf8
          $out | Select-Object -Last 40
          $exit = $LASTEXITCODE
          Write-Host "pytest exit code: $exit"
          if ($exit -ne 0) {
            Write-Host "=== FAILED tests ==="
            Select-String -Path pytest_output.txt -Pattern "^FAILED|^ERROR" | ForEach-Object { Write-Host $_.Line }
            Write-Host "=== First error detail ==="
            Select-String -Path pytest_output.txt -Pattern "assert|Error|Exception" | Select-Object -First 15 | ForEach-Object { Write-Host $_.Line }
          }
          exit $exit
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest_output.txt
          retention-days: 7
